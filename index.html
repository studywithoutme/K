    <script>
        // Data: Vocab Flashcards
        const vocabData = [
            { word: "Drawback", meaning: "ข้อเสีย, ข้อด้อย", example: "High cost is the main drawback. (ราคาแพงคือข้อเสียหลัก)" },
            { word: "Fake", meaning: "ปลอม, ไม่แท้", example: "This flower is fake. (ดอกไม้ดอกนี้เป็นของปลอม)" },
            { word: "Flexible", meaning: "ยืดหยุ่น, ดัดงอได้", example: "The plastic pipe is flexible. (ท่อพลาสติกนี้ดัดงอได้)" },
            { word: "Fragile", meaning: "เปราะบาง, แตกหักง่าย", example: "Be careful, this glass is fragile. (ระวังหน่อย แก้วใบนี้เปราะบางมาก)" },
            { word: "Ironically", meaning: "อย่างย้อนแย้ง", example: "Ironically, the police got lost. (ย้อนแย้งจัง ตำรวจกลับหลงทางเสียเอง)" },
            { word: "Luxury", meaning: "หรูหรา, ฟุ่มเฟือย", example: "He bought a luxury car. (เขาซื้อรถหรู)" },
            { word: "Scarce", meaning: "ขาดแคลน, มีน้อย", example: "Fresh water is scarce here. (น้ำสะอาดที่นี่มีน้อยและขาดแคลน)" },
            { word: "Stiff", meaning: "แข็ง, ดัดยาก", example: "These new shoes feel stiff. (รองเท้าใหม่คู่นี้รู้สึกแข็งดัดยาก)" },
            { word: "Take off", meaning: "ประสบความสำเร็จอย่างรวดเร็ว", example: "Her online business began to take off. (ธุรกิจออนไลน์ของเธอเริ่มประสบความสำเร็จอย่างรวดเร็ว)" },
            { word: "Wire", meaning: "ลวด, สายไฟ", example: "Cut the green wire. (ตัดสายไฟสีเขียว)" },
            { word: "Bacteria", meaning: "แบคทีเรีย", example: "Soap kills bacteria. (สบู่ช่วยฆ่าแบคทีเรีย)" },
            { word: "Settle", meaning: "ตั้งถิ่นฐาน, ตั้งรกราก", example: "They plan to settle in Tokyo. (พวกเขาตั้งใจจะย้ายไปตั้งรกรากที่โตเกียว)" },
            { word: "Preserve", meaning: "ถนอมอาหาร", example: "Salt helps preserve meat. (เกลือช่วยถนอมอาหารจำพวกเนื้อสัตว์)" },
            { word: "Limitation", meaning: "ข้อจำกัด", example: "Everyone has their own limitation. (ทุกคนต่างมีข้อจำกัดของตัวเอง)" },
            { word: "Tightly", meaning: "อย่างแน่นหนา", example: "Close the bottle tightly. (ปิดฝาขวดให้แน่นหนา)" },
            { word: "Critical", meaning: "สำคัญยิ่ง", example: "Water is critical for life. (น้ำมีความสำคัญยิ่งต่อชีวิต)" },
            { word: "Break down", meaning: "ย่อยสลาย, แยกส่วน", example: "Food breaks down in the stomach. (อาหารจะย่อยสลายในกระเพาะ)" },
            { word: "Transform", meaning: "เปลี่ยนแปลง", example: "Heat can transform ice into water. (ความร้อนสามารถเปลี่ยนรูปน้ำแข็งให้เป็นน้ำ)" },
            { word: "Nutritious", meaning: "มีคุณค่าทางโภชนาการ", example: "Milk is very nutritious. (นมมีคุณค่าทางโภชนาการสูง)" },
            { word: "Adapt", meaning: "ปรับตัว", example: "We must adapt to new circumstances. (เราต้องรู้จักปรับตัวให้เข้ากับสถานการณ์ใหม่)" },
            { word: "Pursue", meaning: "ไล่ตาม (เป้าหมาย)", example: "Pursue your dreams. (จงไล่ตามความฝันของคุณ)" },
            { word: "Assertive", meaning: "มั่นใจ, กล้าแสดงออก", example: "You need to be more assertive. (คุณต้องมีความมั่นใจและกล้าแสดงออกมากกว่านี้)" },
            { word: "Credit", meaning: "คำชมเชย, ความดีความชอบ", example: "She took credit for the team's work. (เธอรับความดีความชอบจากผลงานของทีม)" },
            { word: "Remarkable", meaning: "โดดเด่น, น่าทึ่ง", example: "He has a remarkable talent. (เขาเปิดตัวพร้อมความสามารถที่โดดเด่นน่าทึ่ง)" },
            { word: "Disrupt", meaning: "รบกวน, เปลี่ยนแปลงรูปแบบเดิม", example: "Noise can disrupt my sleep. (เสียงดังรบกวนการนอนของฉัน)" },
            { word: "Determined", meaning: "มุ่งมั่น, แน่วแน่", example: "She is determined to win. (เธอตั้งใจและมุ่งมั่นที่จะชนะ)" },
            { word: "Ambitious", meaning: "ทะเยอทะยาน", example: "He is an ambitious young man. (เขาเป็นชายหนุ่มที่มีความทะเยอทะยาน)" },
            { word: "Insurance", meaning: "การประกันภัย", example: "I bought health insurance. (ฉันซื้อประกันสุขภาพไว้)" },
            { word: "Secure", meaning: "ปลอดภัย, มั่นคง", example: "Keep your password secure. (เก็บรหัสผ่านของคุณให้ปลอดภัย)" },
            { word: "Network", meaning: "เครือข่าย, คอนเนกชัน", example: "A wide network helps your job search. (เครือข่ายคอนเนกชันที่กว้างขวางช่วยให้หางานง่ายขึ้น)" }
        ];

        // Data: Questions & Answer Key
        const quizData = [
            { q: "1. What is the meaning of the word drawback?", options: ["a. idea", "b. disadvantage", "c. cost", "d. benefit"], ans: "b" },
            { q: "2. The word fake means ______.", options: ["a. flowering", "b. wild", "c. not real", "d. genuine"], ans: "c" },
            { q: "3. Something that is flexible is ______.", options: ["a. able to bend", "b. heavy", "c. growing", "d. stiff"], ans: "a" },
            { q: "4. If an item is fragile, it is ______.", options: ["a. difficult to use", "b. expensive", "c. easily broken", "d. heavy"], ans: "c" },
            { q: "5. The word ironically means ______.", options: ["a. in an unexpected way", "b. obviously", "c. in a way that is hard to understand", "d. safely"], ans: "a" },
            { q: "6. Luxury items are ______.", options: ["a. popular", "b. very expensive but not necessary", "c. imported from other countries", "d. easily broken"], ans: "b" },
            { q: "7. The word scarce means ______.", options: ["a. far away", "b. hard to find", "c. on the ground", "d. attractive"], ans: "b" },
            { q: "8. Shoes that are stiff are ______.", options: ["a. attractive", "b. difficult to find", "c. hard to bend", "d. not real"], ans: "c" },
            { q: "9. If a business or trend took off, it ______.", options: ["a. suddenly became successful", "b. was a surprise", "c. made a profit", "d. stopped working"], ans: "a" },
            { q: "10. A wire is defined as a ______.", options: ["a. thin piece of metal", "b. signal", "c. piece of cloth", "d. large garage"], ans: "a" },
            { q: "11. Very small organisms that live everywhere and can cause disease are called ______.", options: ["a. plants", "b. bacteria", "c. viruses", "d. insects"], ans: "b" },
            { q: "12. To settle means ______.", options: ["a. to go live somewhere permanently", "b. to travel around the world", "c. to build a new factory", "d. to stop working"], ans: "a" },
            { q: "13. To prepare food so it does not go bad is to ______ it.", options: ["a. transform", "b. adapt", "c. preserve", "d. disrupt"], ans: "c" },
            { q: "14. The word limitation means ______.", options: ["a. a large amount of something", "b. something that controls or reduces activity", "c. a rule for health", "d. an open space"], ans: "b" },
            { q: "15. If something is closed tightly, it is closed ______.", options: ["a. loosely", "b. firmly; in a way that is difficult to open again", "c. slowly", "d. quickly"], ans: "b" },
            { q: "16. The word critical means ______.", options: ["a. very important; necessary", "b. dangerous", "c. harmful", "d. easy to break"], ans: "a" },
            { q: "17. To change chemically into smaller parts is to ______.", options: ["a. break down", "b. build up", "c. adapt", "d. preserve"], ans: "a" },
            { q: "18. To transform means ______.", options: ["a. to move slowly", "b. to change completely", "c. to keep the same", "d. to reduce power"], ans: "b" },
            { q: "19. Food that contains substances necessary for growth and good health is ______.", options: ["a. fragile", "b. nutritious", "c. scarce", "d. stiff"], ans: "b" },
            { q: "20. To adapt means ______.", options: ["a. to change something for different conditions or use", "b. to break into pieces", "c. to buy something new", "d. to stay in one place"], ans: "a" },
            { q: "21. (Part 2: Q1) As a teenager, she ______ be much thinner. (Note: be is a state verb)", options: ["a. used to", "b. would", "c. both used to and would", "d. neither"], ans: "a" },
            { q: "22. (Part 2: Q2) When he was a student, he ______ live in Japan. (Note: live is a state verb)", options: ["a. would", "b. used to", "c. both used to and would", "d. neither"], ans: "b" },
            { q: "23. (Part 2: Q3) When I was growing up, I ______ have a pet lizard. (Note: have is a state verb)", options: ["a. would", "b. used to", "c. both used to and would", "d. neither"], ans: "b" },
            { q: "24. (Part 2: Q4) In the 18th century, people ______ write their documents by hand. (Note: write is an action verb)", options: ["a. used to", "b. would", "c. both used to / would", "d. had to be"], ans: "c" },
            { q: "25. (Part 2: Q5) Which word can ONLY describe past habits/actions, but CANNOT be used with state verbs?", options: ["a. used to", "b. would", "c. simple past", "d. present perfect"], ans: "b" },
            { q: "26. (Part 3: Q1) Original: Tappsi, which was founded in 2012, merged with another company in 2015.\nWhich is a correct reduced form?", options: ["a. Founded in 2012, Tappsi merged with another company in 2015.", "b. Tappsi founded in 2012 merged with another company in 2015.", "c. Which founded in 2012, Tappsi merged with another company in 2015.", "d. Was founded in 2012, Tappsi merged with another company in 2015."], ans: "a" },
            { q: "27. (Part 3: Q2) Original: Kipchoge, who is admired all over the world, retired in 1973.\nWhich is the correct reduced form placed in front of the subject?", options: ["a. Admired all over the world, Kipchoge retired in 1973.", "b. Who is admired all over the world, Kipchoge retired in 1973.", "c. Is admired all over the world, Kipchoge retired in 1973.", "d. Admired all over the world Kipchoge, retired in 1973."], ans: "a" },
            { q: "28. (Part 3: Q3) Original: Shiok Meats, which is supported partly by the government, will offer products soon.\nWhich is the correct reduced form?", options: ["a. Supported partly by the government, Shiok Meats will offer products soon.", "b. Which supported partly by the government, Shiok Meats will offer products.", "c. Supporting partly by the government, Shiok Meats will offer products.", "d. Is supported partly by the government, Shiok Meats will offer products."], ans: "a" },
            { q: "29. (Part 3: Q4) Non-essential adjective clauses use relative pronouns like which or who, but they CANNOT use ______.", options: ["a. where", "b. that", "c. when", "d. whose"], ans: "b" },
            { q: "30. (Part 3: Q5) How do you reduce a non-essential adjective clause with passive voice (be + past participle)?", options: ["a. Delete only the verb be.", "b. Delete both be and the relative pronoun (who/which).", "c. Delete the past participle verb.", "d. Add the word that."], ans: "b" }
        ];

        let timerInterval;
        let secondsElapsed = 0;

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        // แก้ไขฟังก์ชันนี้ให้เปิดหน้าเมนู Mock (eng-mock-menu)
        function switchEngTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            if(tab === 'learning') {
                tabs[0].classList.add('active');
                document.getElementById('eng-learning').style.display = 'block';
                document.getElementById('eng-mock-menu').style.display = 'none';
                document.getElementById('eng-mock-1').style.display = 'none';
                document.getElementById('eng-mock-coming-soon').style.display = 'none';
                document.getElementById('eng-result').style.display = 'none';
                stopTimer();
            } else if(tab === 'mock') {
                tabs[1].classList.add('active');
                document.getElementById('eng-learning').style.display = 'none';
                document.getElementById('eng-mock-menu').style.display = 'block'; // แสดงหน้าเลือก Mock 1-3
                document.getElementById('eng-mock-1').style.display = 'none';
                document.getElementById('eng-mock-coming-soon').style.display = 'none';
                document.getElementById('eng-result').style.display = 'none';
                stopTimer();
            }
        }

        function startMockExam(examNumber) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn')[1].classList.add('active');

            document.getElementById('eng-learning').style.display = 'none';
            document.getElementById('eng-mock-menu').style.display = 'none';
            document.getElementById('eng-result').style.display = 'none';

            if(examNumber === 1) {
                document.getElementById('eng-mock-coming-soon').style.display = 'none';
                document.getElementById('eng-mock-1').style.display = 'block';
                document.getElementById('quiz-form').reset();
                startTimer();
            } else {
                document.getElementById('eng-mock-1').style.display = 'none';
                document.getElementById('eng-mock-coming-soon').style.display = 'block';
                stopTimer();
            }
            window.scrollTo(0,0);
        }

        function renderFlashcards() {
            const container = document.getElementById('flashcard-container');
            container.innerHTML = '';
            vocabData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flashcard';
                card.onclick = () => card.classList.toggle('flipped');
                card.innerHTML = `
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <h3>${item.word}</h3>
                        </div>
                        <div class="flashcard-back">
                            <h4>${item.meaning}</h4>
                            <p>${item.example}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            quizData.forEach((qItem, index) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';
                
                let optionsHtml = '';
                qItem.options.forEach(opt => {
                    const optKey = opt.trim().charAt(0);
                    optionsHtml += `
                        <label class="option-label">
                            <input type="radio" name="q${index}" value="${optKey}">
                            ${opt}
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <h4>${qItem.q.replace('\n', '<br>')}</h4>
                    <div class="options">${optionsHtml}</div>
                `;
                container.appendChild(qCard);
            });
        }

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function submitQuiz() {
            stopTimer();
            let score = 0;

            quizData.forEach((qItem, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if(selected && selected.value === qItem.ans) {
                    score++;
                }
            });

            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            const timeString = `${mins}:${secs}`;

            document.getElementById('score-text').innerText = score;
            document.getElementById('time-taken-text').innerText = timeString;

            let feedback = "";
            if(score >= 25) {
                feedback = "🌟 ยอดเยี่ยมมาก! คุณมีความเข้าใจในคำศัพท์และไวยากรณ์เป็นอย่างดี";
            } else if(score >= 18) {
                feedback = "👍 ทำได้ดี! ลองกลับไปทบทวนจุดที่ผิดในส่วน Learning ดูอีกนิดนะครับ";
            } else {
                feedback = "💪 พยายามอีกนิด! แนะนำให้กลับไปทบทวน Flashcards และ Reading อีกครั้งนะ";
            }
            document.getElementById('feedback-text').innerText = feedback;

            document.getElementById('eng-mock-1').style.display = 'none';
            document.getElementById('eng-result').style.display = 'block';
            window.scrollTo(0,0);
        }

        window.onload = () => {
            renderFlashcards();
            renderQuiz();
        };
    </script>
